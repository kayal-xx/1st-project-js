<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - To Do App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- SIGNUP FORM -->
    <div class="login-container">
        <div class="signup-card">
            <div class="login-header">
                <h1>To Do <span>List</span></h1>
                <p class="login-subtitle">Create your account</p>
            </div>

            <form id="signupForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" placeholder="Enter your email" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="Create a password (min 6 chars)" required autocomplete="off">
                </div>

                <button type="submit" class="login-btn">Create Account</button>
            </form>

            <div class="login-footer">
                <p>Already have an account? <a href="login.html" class="toggle-link">Sign In</a></p>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>

</html>
